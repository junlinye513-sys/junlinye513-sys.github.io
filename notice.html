<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>平台公告與營運說明｜PassGo 考照通 - 技術士檢定學科練題網</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PassGo 考照通的平台公告與營運說明。了解本站如何幫助考生準備 115 年技術士學科檢定，以及未來的系統維護與更新計畫。">

  <style>
    :root {
      --primary: #4A8FE7;
      --primary-dark: #2d6ac5;
      --bg: #f2f6fc;
    }
    body {
      font-family: "Microsoft JhengHei", system-ui, sans-serif;
      background: var(--bg);
      margin: 0;
      display: flex;
      flex-direction: column; /* 讓 nav 跟 box 垂直排列 */
      min-height: 100vh;
    }

    /* 導覽列 */
    .navbar {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0,0,0,0.05);
      padding: 12px 0;
      width: 100%;
    }
    .nav-container {
      max-width: 1000px;
      margin: auto;
      padding: 0 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .nav-logo { font-weight: bold; color: var(--primary-dark); text-decoration: none; }
    .nav-menu { display: flex; gap: 15px; list-style: none; margin: 0; padding: 0; }
    .nav-menu a { text-decoration: none; color: #555; font-size: 14px; }

    .main-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      max-width: 500px;
      width: 100%;
      text-align: center;
    }

    h1 { margin-top: 0; color: var(--primary-dark); font-size: 24px; }

    .content-text {
      font-size: 15px;
      color: #444;
      line-height: 1.8;
      text-align: left;
      background: #f9fbff;
      padding: 20px;
      border-radius: 12px;
      margin: 20px 0;
    }

    .btn-group { display: flex; gap: 10px; justify-content: center; }

    button {
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      transition: 0.3s;
      font-weight: bold;
    }
    button.secondary { background: #fff; color: var(--primary); border: 1px solid var(--primary); }
    button:hover { background: var(--primary-dark); color: #fff; }

    @media (max-width: 480px) {
      .btn-group { flex-direction: column; }
    }
  </style>
</head>

<body>

<nav class="navbar">
  <div class="nav-container">
    <a href="index.html" class="nav-logo">🎯 PassGo 考照通</a>
    <ul class="nav-menu">
      <li><a href="index.html">首頁</a></li>
      <li><a href="about.html">關於本站</a></li>
    </ul>
  </div>
</nav>

<div class="main-content">
  <div class="box">
    <h1>平台公告與營運說明</h1>

    <div class="content-text">
      <strong>各位準備考照的同學，你們好：</strong><br><br>
      「PassGo 考照通」是一個專為 115 年度技術士檢定打造的<strong>免費學習資源站</strong>。為了讓大家有一個穩定、順暢的刷題環境，我會持續在課餘時間進行系統維護：<br>
      <ul>
        <li>第一時間跟進勞動部最新題庫，確保大家不會練到舊題目。</li>
        <li>持續優化手機版操作介面，讓你們搭車、等餐也能隨時隨地刷題。</li>
        <li>幫大家整理更多實用的考前衝刺筆記與共同科目必考重點。</li>
      </ul>
      謝謝每一位同學的回饋與支持。如果覺得這個網站好用，也歡迎分享給身邊一起奮戰的夥伴喔！祝大家順利 Pass！
    </div>

    <div class="btn-group">
      <button onclick="location.href='index.html'">開始刷題去</button>
      <button class="secondary" onclick="location.href='about.html'">關於本站</button>
    </div>
  </div>
</div>

</body>
</html>
